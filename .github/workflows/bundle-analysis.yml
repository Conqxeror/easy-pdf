name: Bundle Analysis

on:
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Build & Bundle Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build with analyzer
        env:
          ANALYZE: 'true'
        run: |
          npm run build

      - name: Print vendor chunk sizes
        run: |
          echo "Looking for vendor chunk files under .next/static/chunks"
          ls -lah .next/static/chunks || true
          VFILES=$(ls .next/static/chunks/vendors-*.js 2>/dev/null || true)
          if [ -z "$VFILES" ]; then
            echo "No vendor chunk file found matching vendors-*.js"
          else
            for f in $VFILES; do
              echo "File: $f"
              echo "Size (raw bytes): $(wc -c < $f)"
              echo "Gzip size (bytes): $(gzip -c $f | wc -c)"
            done
          fi

      - name: Upload analyzer reports
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-reports
          path: .next/analyze

      - name: Upload build trace (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-trace
          path: .next/trace || .next/static || .next/server || .next
